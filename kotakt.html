<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Formularz kontaktowy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .kontakt-box {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .kontakt-box h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .kontakt-box p {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input {
      flex: 1;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background: #28a745;
      color: white;
      font-size: 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #218838;
    }

    .stopka {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="kontakt-box">
    <h2>Skontaktuj się z nami</h2>
    <p>Wypełnij poniższy formularz, a odpowiemy tak szybko jak to możliwe.</p>

    <form>
      <div class="row">
        <div>
          <label for="imie">Imię<span style="color:red">*</span>:</label>
          <input type="text" id="imie" name="imie" placeholder="Twoje imię">
        </div>
        <div>
          <label for="nazwisko">Nazwisko:</label>
          <input type="text" id="nazwisko" name="nazwisko" placeholder="Twoje nazwisko">
        </div>
      </div>

      <label for="email">Email<span style="color:red">*</span>:</label>
      <input type="email" id="email" name="email" placeholder="np. jan@kowalski.pl">

      <label for="telefon">Telefon:</label>
      <input type="tel" id="telefon" name="telefon" placeholder="np. 123-456-789">

      <label for="wiadomosc">Wiadomość<span style="color:red">*</span>:</label>
      <textarea id="wiadomosc" name="wiadomosc" rows="5" placeholder="Napisz swoją wiadomość..."></textarea>

      <button type="submit">Wyślij</button>
    </form>

    <div class="stopka">
      * Pola oznaczone gwiazdką są obowiązkowe
    </div>
  </div>

</body>
</html>
